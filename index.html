<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a3a">
<title>Heranças Wesleyanas | IMW Valença</title>
<meta name="description" content="Livreto digital Heranças Wesleyanas da Igreja Metodista Wesleyana – IMW Valença: a história, a identidade e a presença da IMW em Portugal.">
<meta property="og:type" content="book">
<meta property="og:title" content="Heranças Wesleyanas | IMW Valença">
<meta property="og:description" content="Leia online o livreto Heranças Wesleyanas da Igreja Metodista Wesleyana.">
<meta property="og:image" content="https://livreto.imw.pt/capa.jpg">
<meta property="og:url" content="https://livreto.imw.pt/">

<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
  /* Palette and type follow the Portal IMW (imw.pt / IMW Valença): navy hero
     with a dotted grid, red accent, Georgia headings with a red italic line,
     Arial for interface text. */
  :root {
    color-scheme: dark;
    --navy: #071a3a;
    --navy-2: #0c2552;
    --blue: #20457f;
    --blue-light: #eaf1fb;
    --red: #e21f2f;
    --red-on-navy: #ff4a56;
    --cream: #f5f1e9;
    --ink: #0b1930;
    --muted: #5f6e83;
    --white: #fff;
    --text-dim: rgba(255, 255, 255, .72);
    --glass: rgba(7, 26, 58, .80);
    --line: rgba(255, 255, 255, .18);
    --ui: Arial, Helvetica, sans-serif;
    --display: Georgia, "Times New Roman", serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--navy);
    color: var(--white);
    font-family: var(--ui);
    overflow: hidden;
  }
  .desk {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(circle, rgba(255, 255, 255, .10) 1px, transparent 1.4px) 0 0 / 22px 22px,
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(32, 69, 127, .55), transparent 70%),
      linear-gradient(180deg, var(--navy-2), var(--navy) 75%);
    pointer-events: none;
  }
  /* The portal hero's large soft red circle */
  .desk::before {
    content: ""; position: absolute; width: 62vmax; height: 62vmax; border-radius: 50%;
    right: -18vmax; top: -22vmax;
    background: radial-gradient(circle at 40% 60%, rgba(226, 31, 47, .30), rgba(226, 31, 47, .10) 60%, transparent 71%);
  }
  .desk::after {
    content: ""; position: absolute; left: 0; top: 0; width: min(33vw, 260px); height: 3px; background: var(--red);
  }

  .app {
    position: relative; z-index: 1;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-inline: 16px;
  }

  /* Header */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding-block: 14px 6px;
  }
  .brand { display: grid; gap: 2px; min-width: 0; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    color: var(--red-on-navy);
  }
  .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; flex-shrink: 0; }
  .brand h1 {
    margin: 0; font-family: var(--display); font-weight: 500;
    font-size: clamp(22px, 3.2vw, 34px); line-height: 1.05; letter-spacing: -.04em; text-wrap: balance;
  }
  .brand h1 em { font-style: italic; color: var(--red-on-navy); }
  .top-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--glass);
    color: var(--white); font: 800 13px/1 var(--ui);
    height: 40px; min-width: 40px; padding: 0 14px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; text-decoration: none;
    backdrop-filter: blur(8px);
    transition: background .2s, border-color .2s, transform .15s;
  }
  .btn:hover { background: rgba(32, 69, 127, .75); border-color: rgba(255,255,255,.4); }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible, .range:focus-visible, .toc button:focus-visible {
    outline: 2px solid var(--red-on-navy); outline-offset: 2px;
  }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .btn.icon { padding: 0; }
  .btn[aria-pressed="true"] { border-color: var(--red-on-navy); color: var(--red-on-navy); }
  .btn.primary { background: var(--red); border-color: var(--red); }
  .btn.primary:hover { background: #c81526; border-color: #c81526; }

  /* Stage + book */
  .stage {
    position: relative; min-height: 0;
    padding-block: 8px 14px;
  }
  .book-wrap {
    position: relative;
    width: 100%; height: 100%;
    transition: transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .book-wrap.closed-front { transform: translateX(calc(var(--shift, 0px) * -1)); }
  .book-wrap.closed-back  { transform: translateX(var(--shift, 0px)); }
  .book { width: 100%; height: 100%; }
  .book .stf__block { filter: drop-shadow(0 18px 28px rgba(0,0,0,.55)); }
  .book { opacity: 0; transform: translateY(24px) scale(.97); transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); }
  .book.ready { opacity: 1; transform: none; }
  .page { background: #fff; overflow: hidden; }
  .page img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
  .page.hard { background: #fff; }

  .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--display); font-style: italic; font-size: 20px; color: var(--text-dim);
  }

  .hint {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    background: var(--glass); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-size: 12.5px; color: var(--text-dim); white-space: nowrap;
    transition: opacity .6s;
    pointer-events: none;
  }
  .hint.gone { opacity: 0; }

  /* Bottom dock */
  .dock {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .dock-inner {
    display: flex; align-items: center; gap: 10px;
    width: min(760px, 100%);
    background: var(--glass); border: 1px solid var(--line); border-radius: 12px;
    padding: 6px; backdrop-filter: blur(10px);
  }
  .dock-inner .btn { background: transparent; border-color: transparent; }
  .dock-inner .btn:hover { background: rgba(255,255,255,.08); }
  .scrub { position: relative; flex: 1; display: grid; gap: 4px; min-width: 0; padding-inline: 4px; }
  .where {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums;
  }
  .where strong { color: var(--white); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .range {
    -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer;
  }
  .range::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right, var(--red) var(--pct, 0%), rgba(255,255,255,.2) var(--pct, 0%)); }
  .range::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(255,255,255,.2); }
  .range::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--red); }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--white); border: 3px solid var(--red); }
  .range::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--white); border: 3px solid var(--red); }

  .peek {
    position: absolute; bottom: calc(100% + 14px); width: 92px;
    transform: translateX(-50%); pointer-events: none;
    background: var(--white); border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
    opacity: 0; transition: opacity .15s;
  }
  .peek.show { opacity: 1; }
  .peek img { display: block; width: 100%; aspect-ratio: 420 / 595; object-fit: cover; border-radius: 3px 3px 0 0; }
  .peek span { display: block; text-align: center; font-size: 11px; font-weight: 700; color: var(--ink); padding: 3px 0 4px; }

  /* Table of contents drawer */
  .toc {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 5;
    width: min(360px, 88vw);
    background: var(--cream); color: var(--ink); border-right: 3px solid var(--red);
    color-scheme: light;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 20px;
    transform: translateX(-102%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
    display: grid; grid-template-rows: auto 1fr; gap: 18px;
    box-shadow: 20px 0 60px rgba(0,0,0,.5);
  }
  .toc.open { transform: none; }
  .toc-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .toc-head h2 { margin: 4px 0 0; font-family: var(--display); font-size: 34px; font-weight: 500; letter-spacing: -.04em; color: var(--ink); }
  .toc .eyebrow { color: var(--red); }
  .toc .btn { background: var(--white); color: var(--ink); border-color: rgba(11,25,48,.15); backdrop-filter: none; }
  .toc .btn:hover { background: var(--blue-light); }
  .toc ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: grid; gap: 2px; align-content: start; }
  .toc button {
    width: 100%; display: grid; grid-template-columns: 34px 1fr auto; align-items: baseline; gap: 10px;
    background: transparent; border: 0; border-radius: 8px; color: var(--ink);
    padding: 11px 10px; text-align: left; cursor: pointer; font: 500 15px/1.3 var(--ui);
  }
  .toc button:hover { background: var(--white); }
  .toc button.current { background: var(--blue-light); box-shadow: inset 3px 0 0 var(--red); }
  .toc .num { font-family: var(--display); font-style: italic; font-size: 17px; color: var(--red); }
  .toc .pg { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .scrim { position: fixed; inset: 0; z-index: 4; background: rgba(7,26,58,.55); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 640px) {
    .hide-sm { display: none !important; }
    .top { padding-block: 10px 4px; }
    .dock-inner { gap: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .book, .book-wrap, .toc, .hint { transition: none; }
  }
</style>

<div class="desk" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Livreto digital · IMW Valença</span>
      <h1>Heranças <em>Wesleyanas</em></h1>
    </div>
    <div class="top-actions">
      <button class="btn" id="tocBtn" type="button" aria-controls="toc" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span class="hide-sm">Sumário</span>
      </button>
      <button class="btn icon" id="soundBtn" type="button" aria-pressed="false" title="Som ao virar a página">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="soundWaves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" opacity=".35"/></svg>
        <span class="sr-only">Som</span>
      </button>
      <button class="btn icon hide-sm" id="fsBtn" type="button" title="Ecrã inteiro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span class="sr-only">Ecrã inteiro</span>
      </button>
      <a class="btn primary" href="https://imw.pt/igrejas/valenca-do-minho" target="_blank" rel="noopener">
        <span>IMW Valença</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="loading" id="loading">A abrir o livreto…</div>
    <div class="book-wrap closed-front" id="wrap">
      <div class="book" id="book"></div>
    </div>
    <div class="hint" id="hint">Arraste o canto da página, toque nas margens ou use as setas ← →</div>
  </main>

  <footer class="dock">
    <div class="dock-inner">
      <button class="btn icon" id="firstBtn" type="button" title="Capa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17 6 12l5-5M18 17l-5-5 5-5"/></svg><span class="sr-only">Ir para a capa</span></button>
      <button class="btn icon" id="prevBtn" type="button" title="Página anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span class="sr-only">Página anterior</span></button>
      <div class="scrub">
        <div class="where"><strong id="section">Capa</strong><span id="pageLabel">Capa</span></div>
        <label class="sr-only" for="range">Ir para a página</label>
        <input class="range" id="range" type="range" min="0" max="39" step="1" value="0">
        <div class="peek" id="peek"><img id="peekImg" alt=""><span id="peekLabel"></span></div>
      </div>
      <button class="btn icon" id="nextBtn" type="button" title="Página seguinte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg><span class="sr-only">Página seguinte</span></button>
      <button class="btn icon" id="lastBtn" type="button" title="Contracapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"/></svg><span class="sr-only">Ir para a contracapa</span></button>
    </div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<nav class="toc" id="toc" aria-label="Sumário" aria-hidden="true">
  <div class="toc-head">
    <div>
      <span class="eyebrow">Mapa do livreto</span>
      <h2>Sumário</h2>
    </div>
    <button class="btn icon" id="tocClose" type="button" title="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="sr-only">Fechar sumário</span></button>
  </div>
  <ol id="tocList"></ol>
</nav>

<script src="js/page-flip.browser.js"></script>
<script>
(() => {
  const TOTAL = 40;
  const src = i => `pages/p${String(i + 1).padStart(2, "0")}.webp`;
  // Page index = printed page number (0 = cover, 39 = back cover).
  const CHAPTERS = [
    { num: "",    title: "Capa",                         page: 0 },
    { num: "·",   title: "Sumário",                      page: 1 },
    { num: "I",   title: "Introdução",                   page: 2 },
    { num: "II",  title: "Nossa Herança",                page: 5 },
    { num: "III", title: "O Movimento Metodista",        page: 7 },
    { num: "IV",  title: "Influências Históricas",       page: 12 },
    { num: "V",   title: "Identidade Wesleyana",         page: 19 },
    { num: "PT",  title: "História da IMW em Portugal",  page: 26 },
    { num: "VI",  title: "IMW Valença",                  page: 30 },
    { num: "QR",  title: "Site oficial e ligações",      page: 37 },
    { num: "·",   title: "Notas",                        page: 38 },
    { num: "",    title: "Contracapa",                   page: 39 },
  ];
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const pageName = i => i === 0 ? "Capa" : i === TOTAL - 1 ? "Contracapa" : `Página ${String(i).padStart(2, "0")}`;
  const sectionOf = i => CHAPTERS.filter(c => c.page <= i).pop().title;

  // Build pages
  const book = $("book");
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement("div");
    d.className = "page" + (i === 0 || i === TOTAL - 1 ? " hard" : "");
    if (i === 0 || i === TOTAL - 1) d.dataset.density = "hard";
    const img = document.createElement("img");
    img.src = src(i);
    img.alt = pageName(i);
    img.decoding = "async";
    d.appendChild(img);
    book.appendChild(d);
  }

  // The book fills the desk area; below 2 × minWidth it switches to one page.
  const wrap = $("wrap");
  let spreadMode = false;
  function fit() {
    spreadMode = flip.getOrientation() === "landscape";
    const r = flip.getBoundsRect();
    wrap.style.setProperty("--shift", spreadMode && r ? Math.round(r.pageWidth / 2) + "px" : "0px");
  }

  const flip = new St.PageFlip(book, {
    width: 420, height: 595,
    size: "stretch",
    minWidth: 320, maxWidth: 1200, minHeight: 200, maxHeight: 1700,
    showCover: true,
    usePortrait: true,
    drawShadow: true,
    maxShadowOpacity: .55,
    flippingTime: reduce ? 250 : 900,
    mobileScrollSupport: false,
    swipeDistance: 24,
    showPageCorners: true,
  });
  flip.loadFromHTML(document.querySelectorAll("#book .page"));

  // Centre a closed book: the cover alone sits on the right half of a spread.
  function placeBook(i) {
    fit();
    wrap.classList.toggle("closed-front", spreadMode && i === 0);
    wrap.classList.toggle("closed-back", spreadMode && i >= TOTAL - 1);
  }

  // UI state
  const range = $("range");
  function update(i) {
    range.value = i;
    range.style.setProperty("--pct", (i / (TOTAL - 1) * 100) + "%");
    let label = pageName(i);
    if (flip.getOrientation() === "landscape" && i > 0 && i < TOTAL - 1) {
      const l = i % 2 ? i : i - 1;
      label = `Páginas ${String(l).padStart(2, "0")}–${String(l + 1).padStart(2, "0")}`;
    }
    $("pageLabel").textContent = label;
    $("section").textContent = sectionOf(i);
    $("prevBtn").disabled = $("firstBtn").disabled = i === 0;
    $("nextBtn").disabled = $("lastBtn").disabled = i >= TOTAL - 1;
    document.querySelectorAll("#tocList button").forEach(b => {
      const s = sectionOf(i);
      b.classList.toggle("current", b.dataset.title === s);
    });
    placeBook(i);
    try { history.replaceState(null, "", i ? `#pagina-${i}` : location.pathname + location.search); } catch (e) {}
  }

  const hint = $("hint");
  let hintTimer = setTimeout(() => hint.classList.add("gone"), 7000);
  flip.on("flip", e => { update(e.data); hint.classList.add("gone"); clearTimeout(hintTimer); });
  flip.on("changeOrientation", () => update(flip.getCurrentPageIndex()));
  flip.on("changeState", e => { if (e.data === "flipping") rustle(); });
  flip.on("init", () => {
    $("loading").remove();
    requestAnimationFrame(() => book.classList.add("ready"));
    const m = /^#pagina-(\d{1,2})$/.exec(location.hash);
    const start = m ? Math.min(TOTAL - 1, +m[1]) : 0;
    if (start) flip.turnToPage(start);
    update(start);
  });

  window.addEventListener("resize", () => setTimeout(() => placeBook(flip.getCurrentPageIndex()), 0));

  // Controls
  $("prevBtn").onclick = () => flip.flipPrev();
  $("nextBtn").onclick = () => flip.flipNext();
  $("firstBtn").onclick = () => flip.flip(0);
  $("lastBtn").onclick = () => flip.flip(TOTAL - 1);
  document.addEventListener("keydown", e => {
    if (e.target === range) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { flip.flipNext(); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { flip.flipPrev(); e.preventDefault(); }
    else if (e.key === "Home") flip.flip(0);
    else if (e.key === "End") flip.flip(TOTAL - 1);
    else if (e.key === "Escape") closeToc();
  });

  // Scrubber with page preview
  const peek = $("peek");
  function showPeek(v) {
    $("peekImg").src = src(v);
    $("peekLabel").textContent = v === 0 ? "Capa" : v === TOTAL - 1 ? "Contracapa" : String(v).padStart(2, "0");
    const r = range.getBoundingClientRect(), pr = range.parentElement.getBoundingClientRect();
    const x = r.left - pr.left + 7 + (r.width - 14) * v / (TOTAL - 1);
    peek.style.left = Math.max(46, Math.min(pr.width - 46, x)) + "px";
    peek.classList.add("show");
    range.style.setProperty("--pct", (v / (TOTAL - 1) * 100) + "%");
  }
  range.addEventListener("input", () => showPeek(+range.value));
  range.addEventListener("change", () => { peek.classList.remove("show"); flip.flip(+range.value); });
  range.addEventListener("blur", () => peek.classList.remove("show"));

  // Table of contents
  const list = $("tocList");
  CHAPTERS.forEach(c => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.dataset.title = c.title;
    b.innerHTML = `<span class="num">${c.num}</span><span>${c.title}</span><span class="pg">${c.page === 0 ? "" : c.page === TOTAL - 1 ? "" : String(c.page).padStart(2, "0")}</span>`;
    b.onclick = () => { closeToc(); setTimeout(() => flip.flip(c.page), 250); };
    li.appendChild(b); list.appendChild(li);
  });
  const toc = $("toc"), scrim = $("scrim"), tocBtn = $("tocBtn");
  function openToc() { toc.classList.add("open"); scrim.classList.add("open"); toc.setAttribute("aria-hidden", "false"); tocBtn.setAttribute("aria-expanded", "true"); list.querySelector(".current, button")?.focus(); }
  function closeToc() { if (!toc.classList.contains("open")) return; toc.classList.remove("open"); scrim.classList.remove("open"); toc.setAttribute("aria-hidden", "true"); tocBtn.setAttribute("aria-expanded", "false"); tocBtn.focus(); }
  tocBtn.onclick = () => toc.classList.contains("open") ? closeToc() : openToc();
  $("tocClose").onclick = closeToc;
  scrim.onclick = closeToc;

  // Fullscreen (optional; some views refuse it)
  $("fsBtn").onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (e) {}
  };
  document.addEventListener("fullscreenchange", () => setTimeout(() => window.dispatchEvent(new Event("resize")), 60));

  // Soft paper rustle, synthesised with Web Audio (off until the reader turns it on)
  let audio = null, soundOn = false;
  try { soundOn = localStorage.getItem("herancas-som") === "1"; } catch (e) {}
  const soundBtn = $("soundBtn");
  function paintSound() { soundBtn.setAttribute("aria-pressed", String(soundOn)); $("soundWaves").setAttribute("opacity", soundOn ? "1" : ".35"); }
  paintSound();
  soundBtn.onclick = () => {
    soundOn = !soundOn; paintSound();
    try { localStorage.setItem("herancas-som", soundOn ? "1" : "0"); } catch (e) {}
    if (soundOn) rustle(true);
  };
  function rustle(force) {
    if (!soundOn && !force) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const dur = .42, n = Math.floor(audio.sampleRate * dur);
      const buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
      for (let k = 0; k < n; k++) {
        const t = k / n;
        d[k] = (Math.random() * 2 - 1) * Math.pow(Math.sin(Math.PI * t), 1.6) * (0.6 + 0.4 * Math.sin(t * 40));
      }
      const s = audio.createBufferSource(); s.buffer = buf;
      const f = audio.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = .7;
      const g = audio.createGain(); g.gain.value = .22;
      s.connect(f).connect(g).connect(audio.destination); s.start();
    } catch (e) {}
  }
})();
</script>
